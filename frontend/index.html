<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking first paint: fetched at high priority by the preload, applied
         as soon as they arrive by /theme-init.js (switches media="print" to "all"; no inline handler, see CSP).
         The Kids-mode fonts (Fredoka, Rubik) are added by theme-init.js / kidsFonts.js only in Kids mode. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@300;400;500;600;700&family=Inter:opsz,wght@14..32,400..800&family=Outfit:wght@500;600;700;800&display=swap" />
    <link id="chronix-webfonts" rel="stylesheet" media="print" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@300;400;500;600;700&family=Inter:opsz,wght@14..32,400..800&family=Outfit:wght@500;600;700;800&display=swap" />
    <title>ChroniX – Interactive Historical & Personal Timelines</title>
    <meta name="description" content="ChroniX – Explore, create, and share interactive historical, personal, and family timelines from photos, books, and documents." />
    <!-- Open Graph / WhatsApp / Telegram / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChroniX" />
    <meta property="og:title" content="ChroniX – Interactive Historical & Personal Timelines" />
    <meta property="og:description" content="Explore, create, and share interactive historical, personal, and family timelines from photos, books, and documents." />
    <meta property="og:image" content="/chronix_logo_full.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="ChroniX – Interactive Historical & Personal Timelines" />
    <meta property="twitter:description" content="Explore, create, and share interactive historical, personal, and family timelines from photos, books, and documents." />
    <meta name="twitter:image" content="/chronix_logo_full.png" />
    <script src="/theme-init.js"></script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
